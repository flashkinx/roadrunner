<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Roadrunner</title>
  <link rel="stylesheet" href="mini.css">
</head>
<body data-dur="1" data-arr="0">
  <div class="pill" id="pill" data-color="grey" data-kind="loading" title="Doppelklick: Einstellungen · Rechtsklick: Menü">
    <span class="dot" aria-hidden="true"></span>
    <span class="dur"><span class="min" id="min">–</span><span class="unit">min</span></span>
    <span class="delta" id="delta"></span>
    <span class="arr"><span class="unit">an</span><span class="clock" id="arr">–:–</span></span>
  </div>
  <script src="mini.js"></script>
</body>
</html>
